<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Vision AI | Login</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Configuration (Same as Dashboard) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        deep: '#05050A',
                        neon: {
                            blue: '#00F0FF',
                            purple: '#BD00FF',
                            mint: '#00FF94',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Glass Panel */
        .glass-panel {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #05050A 20%, transparent 100%),
                        radial-gradient(circle at 0% 0%, rgba(0, 240, 255, 0.1), transparent 40%),
                        radial-gradient(circle at 100% 100%, rgba(189, 0, 255, 0.1), transparent 40%);
        }

        /* Input Styling */
        .input-group input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            background: rgba(0, 240, 255, 0.05);
            border-color: #00F0FF;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            outline: none;
        }

        /* Orb Animation */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite;
        }
        
        .mode-enter {
            animation: fadeSlideIn 0.4s forwards;
        }
        
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-deep text-white h-screen w-screen flex items-center justify-center overflow-hidden selection:bg-neon-blue selection:text-black">

    <!-- Ambient Background -->
    <div class="bg-mesh"></div>
    <div class="orb w-96 h-96 bg-neon-purple/20 top-[-10%] left-[20%]"></div>
    <div class="orb w-64 h-64 bg-neon-blue/20 bottom-[10%] right-[20%] animation-delay-2000"></div>

    <!-- Main Auth Container -->
    <div class="w-full max-w-md p-8 relative">
        
        <!-- Logo Area -->
        <div class="text-center mb-10 flex flex-col items-center">
            <div class="relative w-16 h-16 mb-4 flex items-center justify-center">
                <div class="absolute inset-0 border border-neon-blue/30 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-2 border border-neon-purple/30 rounded-full animate-spin-slow" style="animation-direction: reverse;"></div>
                <i data-lucide="aperture" class="w-8 h-8 text-neon-blue"></i>
            </div>
            <h1 class="font-mono text-3xl font-bold tracking-tight">VISION<span class="text-neon-blue">.AI</span></h1>
            <p class="text-gray-500 text-sm font-mono mt-2 tracking-widest">NEURAL IDENTITY VERIFICATION</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-panel rounded-3xl p-8 relative overflow-hidden">
            <!-- Top Glow Line -->
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-neon-blue to-transparent opacity-50"></div>

            <!-- Toggle Switches -->
            <div class="flex p-1 bg-white/5 rounded-xl mb-8 relative">
                <!-- Sliding Background for Tabs -->
                <div id="tab-bg" class="absolute w-[calc(50%-4px)] h-[calc(100%-8px)] top-1 left-1 bg-white/10 rounded-lg transition-all duration-300 ease-out border border-white/10"></div>
                
                <button onclick="switchMode('signin')" class="flex-1 py-2 text-sm font-mono z-10 text-center transition-colors text-white" id="tab-signin">SIGN IN</button>
                <button onclick="switchMode('signup')" class="flex-1 py-2 text-sm font-mono z-10 text-center transition-colors text-gray-400" id="tab-signup">REGISTER</button>
            </div>

            <!-- Forms Container -->
            <div id="form-container" class="relative">
                
                <!-- SIGN IN FORM -->
                <form id="signin-form" class="space-y-5 mode-enter" onsubmit="event.preventDefault(); window.location.href='VisionLab_UI.html'">
                    <div class="input-group">
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase">Neural ID / Email</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-3.5 w-4 h-4 text-gray-500"></i>
                            <input type="email" placeholder="user@vision.ai" class="w-full bg-transparent text-white pl-12 pr-4 py-3 rounded-xl focus:ring-0 placeholder-gray-600 font-sans text-sm">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase flex justify-between">
                            <span>Passcode</span>
                            <a href="#" class="text-neon-blue hover:text-white transition-colors">Forgot?</a>
                        </label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-4 top-3.5 w-4 h-4 text-gray-500"></i>
                            <input type="password" placeholder="••••••••" class="w-full bg-transparent text-white pl-12 pr-4 py-3 rounded-xl focus:ring-0 placeholder-gray-600 font-sans text-sm">
                        </div>
                    </div>

                    <button class="w-full py-3.5 bg-gradient-to-r from-neon-blue to-neon-purple rounded-xl font-mono font-bold text-black hover:shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2 group mt-2">
                        <span>INITIALIZE SESSION</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <!-- SIGN UP FORM (Hidden initially) -->
                <form id="signup-form" class="space-y-5 hidden" onsubmit="event.preventDefault(); window.location.href='VisionLab_UI.html'">
                    <div class="flex gap-4">
                        <div class="input-group flex-1">
                            <label class="block text-xs font-mono text-gray-400 mb-2 uppercase">First Name</label>
                            <input type="text" placeholder="Ada" class="w-full bg-transparent text-white px-4 py-3 rounded-xl placeholder-gray-600 font-sans text-sm">
                        </div>
                        <div class="input-group flex-1">
                            <label class="block text-xs font-mono text-gray-400 mb-2 uppercase">Last Name</label>
                            <input type="text" placeholder="Lovelace" class="w-full bg-transparent text-white px-4 py-3 rounded-xl placeholder-gray-600 font-sans text-sm">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase">Work Email</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-3.5 w-4 h-4 text-gray-500"></i>
                            <input type="email" placeholder="dev@vision.ai" class="w-full bg-transparent text-white pl-12 pr-4 py-3 rounded-xl focus:ring-0 placeholder-gray-600 font-sans text-sm">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase">Create Passcode</label>
                        <div class="relative">
                            <i data-lucide="shield-check" class="absolute left-4 top-3.5 w-4 h-4 text-gray-500"></i>
                            <input type="password" placeholder="••••••••" class="w-full bg-transparent text-white pl-12 pr-4 py-3 rounded-xl focus:ring-0 placeholder-gray-600 font-sans text-sm">
                        </div>
                    </div>

                    <button class="w-full py-3.5 bg-gradient-to-r from-neon-mint to-teal-500 rounded-xl font-mono font-bold text-black hover:shadow-[0_0_20px_rgba(0,255,148,0.4)] transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2 group mt-2">
                        <span>CREATE ACCOUNT</span>
                        <i data-lucide="user-plus" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                    </button>
                </form>

            </div>

            <!-- Social Auth Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/10"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase font-mono">
                    <span class="bg-[#0b0c15] px-4 text-gray-500" id="divider-text">Or continue with</span>
                    <!-- Note: bg color matches approximate transparency blend for readability -->
                </div>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 py-2.5 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all group">
                    <i data-lucide="github" class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors"></i>
                    <span class="text-sm text-gray-400 group-hover:text-white font-mono">GITHUB</span>
                </button>
                <button class="flex items-center justify-center gap-2 py-2.5 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all group">
                    <svg class="w-5 h-5 opacity-60 group-hover:opacity-100 transition-opacity" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.26.81-.58z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span class="text-sm text-gray-400 group-hover:text-white font-mono">GOOGLE</span>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-600 mt-8 font-mono">
            &copy; 2024 VISION.AI LABS. ACCESS RESTRICTED.
        </p>

    </div>

    <!-- Logic for Tabs -->
    <script>
        lucide.createIcons();

        function switchMode(mode) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const tabBg = document.getElementById('tab-bg');
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');

            if (mode === 'signup') {
                // Animate Tab Background
                tabBg.style.transform = 'translateX(100%)';
                tabBg.style.left = '-4px'; // Adjustment for gap
                
                // Text Colors
                tabSignin.classList.replace('text-white', 'text-gray-400');
                tabSignup.classList.replace('text-gray-400', 'text-white');

                // Form Swap
                signinForm.classList.add('hidden');
                signinForm.classList.remove('mode-enter');
                
                signupForm.classList.remove('hidden');
                signupForm.classList.add('mode-enter');

            } else {
                // Animate Tab Background
                tabBg.style.transform = 'translateX(0)';
                tabBg.style.left = '4px';

                // Text Colors
                tabSignup.classList.replace('text-white', 'text-gray-400');
                tabSignin.classList.replace('text-gray-400', 'text-white');

                // Form Swap
                signupForm.classList.add('hidden');
                signupForm.classList.remove('mode-enter');
                
                signinForm.classList.remove('hidden');
                signinForm.classList.add('mode-enter');
            }
        }
    </script>
</body>
</html>
